
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShiftSync - Worker & Manager Dashboard</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom transitions for smoother UI */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2 text-indigo-600">
                <div class="bg-indigo-600 text-white p-1.5 rounded-lg">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                </div>
                <span class="font-bold text-xl tracking-tight text-slate-800">Shift<span class="text-indigo-600">Sync</span></span>
            </div>

            <div class="flex bg-slate-100 p-1 rounded-lg">
                <button id="btn-view-worker" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-indigo-600 shadow-sm" onclick="toggleView('worker')">
                    Worker
                </button>
                <button id="btn-view-manager" class="px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-700" onclick="toggleView('manager')">
                    Manager
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="mb-6">
            <h1 id="page-title" class="text-2xl font-bold text-slate-800">Time Clock</h1>
            <p id="page-desc" class="text-slate-500">Manage your shift and daily activity logs.</p>
        </div>

        <!-- ================= WORKER VIEW ================= -->
        <div id="view-worker" class="max-w-md mx-auto space-y-6 fade-in">
            <!-- Status Card -->
            <div id="status-card" class="p-6 rounded-2xl shadow-lg text-white transition-all duration-300 bg-gradient-to-br from-indigo-500 to-blue-700">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-lg font-semibold opacity-90">Current Status</h2>
                        <p id="status-text" class="text-3xl font-bold mt-1 tracking-tight">Off Duty</p>
                    </div>
                    <div class="p-3 bg-white/20 rounded-full backdrop-blur-sm">
                        <i data-lucide="clock" class="w-6 h-6"></i>
                    </div>
                </div>

                <div id="timer-container" class="mt-6 text-center hidden">
                    <p class="text-sm opacity-80 mb-1">Elapsed Time</p>
                    <div id="elapsed-time" class="text-5xl font-mono font-bold tracking-wider">00:00:00</div>
                    <p id="start-time-display" class="mt-2 text-sm bg-black/10 inline-block px-3 py-1 rounded-full">Started: --:--</p>
                </div>
            </div>

            <!-- Input Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <div class="space-y-4">
                    
                    <div id="pre-shift-inputs" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Worker Name</label>
                            <div class="relative">
                                <i data-lucide="user" class="absolute left-3 top-3 text-slate-400 w-4 h-4"></i>
                                <input type="text" id="worker-name" placeholder="John Doe" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-600 mb-1">Shift Type</label>
                            <div class="relative">
                                <i data-lucide="briefcase" class="absolute left-3 top-3 text-slate-400 w-4 h-4"></i>
                                <select id="shift-type" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none appearance-none">
                                    <option>Morning (6AM - 2PM)</option>
                                    <option>Afternoon (2PM - 10PM)</option>
                                    <option>Night (10PM - 6AM)</option>
                                    <option>Overtime</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Cuttings Completed</label>
                        <div class="relative">
                            <i data-lucide="scissors" class="absolute left-3 top-3 text-slate-400 w-4 h-4"></i>
                            <input type="number" id="cuttings-count" placeholder="0" class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-600 mb-1">Notes / Log Activity</label>
                        <div class="relative">
                            <i data-lucide="file-text" class="absolute left-3 top-3 text-slate-400 w-4 h-4"></i>
                            <textarea id="shift-notes" placeholder="Logging production count, issues, etc." class="w-full pl-10 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none h-24 resize-none"></textarea>
                        </div>
                    </div>

                    <button id="action-btn" onclick="handleShiftAction()" class="w-full py-3 rounded-xl font-bold text-white shadow-md flex items-center justify-center gap-2 transform active:scale-95 transition-all bg-indigo-600 hover:bg-indigo-700 shadow-indigo-200">
                        <i id="action-icon" data-lucide="play" class="w-5 h-5 fill-current"></i> 
                        <span id="action-text">Start Shift</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ================= MANAGER VIEW ================= -->
        <div id="view-manager" class="space-y-6 hidden fade-in">
            <!-- Analytics Cards -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center gap-4">
                    <div class="p-3 bg-blue-100 text-blue-600 rounded-lg w-fit">
                        <i data-lucide="trending-up" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-sm">Total Hours</p>
                        <p id="stat-hours" class="text-2xl font-bold text-slate-800">0.0</p>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center gap-4">
                    <div class="p-3 bg-orange-100 text-orange-600 rounded-lg w-fit">
                        <i data-lucide="scissors" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-sm">Total Cuttings</p>
                        <p id="stat-cuttings" class="text-2xl font-bold text-slate-800">0</p>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center gap-4">
                    <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg w-fit">
                        <i data-lucide="check-circle" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-sm">Total Shifts</p>
                        <p id="stat-shifts" class="text-2xl font-bold text-slate-800">0</p>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex flex-col md:flex-row md:items-center gap-4">
                    <div class="p-3 bg-purple-100 text-purple-600 rounded-lg w-fit">
                        <i data-lucide="users" class="w-6 h-6"></i>
                    </div>
                    <div>
                        <p class="text-slate-500 text-sm">Workers</p>
                        <p id="stat-workers" class="text-2xl font-bold text-slate-800">0</p>
                    </div>
                </div>
            </div>

            <!-- Data Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <div class="p-5 border-b border-slate-100 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                    <h3 class="font-bold text-lg text-slate-800">Worker Logs</h3>
                    <div class="flex gap-2 w-full md:w-auto">
                        <button onclick="clearData()" class="flex-1 md:flex-none px-4 py-2 text-sm text-red-500 hover:bg-red-50 rounded-lg transition-colors border border-red-100">
                            Clear History
                        </button>
                        <button onclick="exportToExcel()" class="flex-1 md:flex-none px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg flex items-center justify-center gap-2 transition-colors shadow-sm">
                            <i data-lucide="download" class="w-4 h-4"></i> Export
                        </button>
                    </div>
                </div>
                
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600 hidden" id="logs-table">
                        <thead class="bg-slate-50 text-slate-700 font-semibold uppercase tracking-wider text-xs">
                            <tr>
                                <th class="px-6 py-4 whitespace-nowrap">Worker</th>
                                <th class="px-6 py-4 whitespace-nowrap">Date & Time</th>
                                <th class="px-6 py-4 whitespace-nowrap">Shift</th>
                                <th class="px-6 py-4 whitespace-nowrap">Duration</th>
                                <th class="px-6 py-4 whitespace-nowrap">Cuttings</th>
                                <th class="px-6 py-4">Notes</th>
                            </tr>
                        </thead>
                        <tbody id="logs-body" class="divide-y divide-slate-100">
                            <!-- Rows populated by JS -->
                        </tbody>
                    </table>
                    
                    <div id="empty-state" class="p-12 text-center text-slate-400">
                        <i data-lucide="alert-circle" class="w-12 h-12 mx-auto mb-3 opacity-20"></i>
                        <p>No shift data recorded yet.</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Application Logic -->
    <script>
        // --- State Management ---
        let currentView = 'worker';
        let isWorking = false;
        let sessionStartTime = null;
        let timerInterval = null;
        let logs = [];

        // DOM Elements
        const workerNameEl = document.getElementById('worker-name');
        const shiftTypeEl = document.getElementById('shift-type');
        const cuttingsEl = document.getElementById('cuttings-count');
        const notesEl = document.getElementById('shift-notes');
        
        // Initialize Icons
        lucide.createIcons();

        // --- Initialization ---
        function init() {
            // Load logs
            const savedLogs = localStorage.getItem('shiftSyncLogsHtml');
            if (savedLogs) {
                logs = JSON.parse(savedLogs);
            }

            // Load active session
            const savedSession = localStorage.getItem('shiftSyncSessionHtml');
            if (savedSession) {
                const session = JSON.parse(savedSession);
                isWorking = true;
                workerNameEl.value = session.workerName;
                shiftTypeEl.value = session.shiftType;
                cuttingsEl.value = session.cuttings || '';
                notesEl.value = session.notes || '';
                sessionStartTime = new Date(session.startTime);
                
                updateWorkerUI();
                startTimer();
            }

            // Setup input event listeners to auto-save session state if working
            const saveSessionState = () => {
                if (isWorking && sessionStartTime) {
                    saveSessionToStorage();
                }
            };
            cuttingsEl.addEventListener('input', saveSessionState);
            notesEl.addEventListener('input', saveSessionState);
        }

        // --- Core Functions ---

        function toggleView(view) {
            currentView = view;
            
            const btnWorker = document.getElementById('btn-view-worker');
            const btnManager = document.getElementById('btn-view-manager');
            const viewWorker = document.getElementById('view-worker');
            const viewManager = document.getElementById('view-manager');
            const pageTitle = document.getElementById('page-title');
            const pageDesc = document.getElementById('page-desc');

            if (view === 'worker') {
                btnWorker.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-indigo-600 shadow-sm";
                btnManager.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-700";
                viewWorker.classList.remove('hidden');
                viewManager.classList.add('hidden');
                pageTitle.innerText = "Time Clock";
                pageDesc.innerText = "Manage your shift and daily activity logs.";
            } else {
                btnManager.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all bg-white text-indigo-600 shadow-sm";
                btnWorker.className = "px-4 py-1.5 rounded-md text-sm font-medium transition-all text-slate-500 hover:text-slate-700";
                viewManager.classList.remove('hidden');
                viewWorker.classList.add('hidden');
                pageTitle.innerText = "Shift Reports";
                pageDesc.innerText = "View team performance and download data.";
                renderManagerDashboard();
            }
        }

        function handleShiftAction() {
            if (!isWorking) {
                // Start Shift
                const name = workerNameEl.value.trim();
                if (!name) {
                    alert("Please enter your name first.");
                    return;
                }

                sessionStartTime = new Date();
                isWorking = true;
                saveSessionToStorage();
                updateWorkerUI();
                startTimer();
            } else {
                // End Shift
                stopTimer();
                const endTime = new Date();
                const durationSeconds = Math.floor((endTime - sessionStartTime) / 1000);
                
                const newLog = {
                    id: Date.now(),
                    workerName: workerNameEl.value,
                    shiftType: shiftTypeEl.value,
                    startTime: sessionStartTime.toISOString(),
                    endTime: endTime.toISOString(),
                    duration: formatTime(durationSeconds),
                    rawDuration: durationSeconds,
                    cuttings: cuttingsEl.value || 0,
                    notes: notesEl.value,
                    date: new Date().toLocaleDateString()
                };

                logs.unshift(newLog); // Add to beginning of array
                localStorage.setItem('shiftSyncLogsHtml', JSON.stringify(logs));
                
                // Clear session
                isWorking = false;
                sessionStartTime = null;
                localStorage.removeItem('shiftSyncSessionHtml');
                
                // Reset Form
                cuttingsEl.value = '';
                notesEl.value = '';
                updateWorkerUI();
            }
        }

        function saveSessionToStorage() {
            localStorage.setItem('shiftSyncSessionHtml', JSON.stringify({
                workerName: workerNameEl.value,
                shiftType: shiftTypeEl.value,
                startTime: sessionStartTime.toISOString(),
                notes: notesEl.value,
                cuttings: cuttingsEl.value
            }));
        }

        // --- UI Updates ---

        function updateWorkerUI() {
            const statusCard = document.getElementById('status-card');
            const statusText = document.getElementById('status-text');
            const preShiftInputs = document.getElementById('pre-shift-inputs');
            const timerContainer = document.getElementById('timer-container');
            const startTimeDisplay = document.getElementById('start-time-display');
            const actionBtn = document.getElementById('action-btn');
            const actionText = document.getElementById('action-text');

            if (isWorking) {
                // Working State
                statusCard.classList.remove('from-indigo-500', 'to-blue-700');
                statusCard.classList.add('from-green-500', 'to-emerald-700');
                statusText.innerText = 'On Shift';
                
                preShiftInputs.classList.add('hidden');
                timerContainer.classList.remove('hidden');
                
                const timeStr = sessionStartTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                startTimeDisplay.innerText = `Started: ${timeStr}`;

                actionBtn.classList.remove('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-200');
                actionBtn.classList.add('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-200');
                actionBtn.innerHTML = `<i data-lucide="square" class="w-5 h-5 fill-current"></i> <span id="action-text">End Shift</span>`;
            } else {
                // Off Duty State
                statusCard.classList.add('from-indigo-500', 'to-blue-700');
                statusCard.classList.remove('from-green-500', 'to-emerald-700');
                statusText.innerText = 'Off Duty';
                
                preShiftInputs.classList.remove('hidden');
                timerContainer.classList.add('hidden');

                actionBtn.classList.add('bg-indigo-600', 'hover:bg-indigo-700', 'shadow-indigo-200');
                actionBtn.classList.remove('bg-rose-500', 'hover:bg-rose-600', 'shadow-rose-200');
                actionBtn.innerHTML = `<i data-lucide="play" class="w-5 h-5 fill-current"></i> <span id="action-text">Start Shift</span>`;
